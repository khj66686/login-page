<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 380px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #f5f5f4;
      border: 0.5px solid rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .icon-wrap i { font-size: 20px; color: #6b7280; }

    h1 { font-size: 18px; font-weight: 500; color: #111; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #6b7280; }

    .form { display: flex; flex-direction: column; gap: 14px; }

    label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .label-row a {
      font-size: 12px;
      color: #2563eb;
      text-decoration: none;
    }

    .input-wrap { position: relative; }

    .input-wrap i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #9ca3af;
      pointer-events: none;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      font-size: 14px;
      color: #111;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
    }

    .pw-toggle i { font-size: 16px; }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .remember input { width: 15px; height: 15px; cursor: pointer; }
    .remember label { font-size: 13px; color: #6b7280; cursor: pointer; margin: 0; }

    .btn-primary {
      margin-top: 6px;
      width: 100%;
      padding: 10px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: rgba(0,0,0,0.12);
    }

    .divider span { font-size: 12px; color: #9ca3af; }

    .btn-social {
      width: 100%;
      padding: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #6b7280;
      background: transparent;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-social:hover { background: #f5f5f4; }
    .btn-social i { font-size: 16px; }

    .signup {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin-top: 1.5rem;
    }

    .signup a { color: #2563eb; text-decoration: none; }

    .message {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
      border: 0.5px solid #bbf7d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 0.5px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="icon-wrap">
        <i class="ti ti-lock" aria-hidden="true"></i>
      </div>
      <h1>로그인</h1>
      <p class="subtitle">계정에 로그인하세요</p>
    </div>

    <form class="form" onsubmit="handleLogin(event)">
      <div>
        <label for="email">이메일</label>
        <div class="input-wrap">
          <i class="ti ti-mail" aria-hidden="true"></i>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>
      </div>

      <div>
        <div class="label-row">
          <label for="password" style="margin:0;">비밀번호</label>
          <a href="#">비밀번호 찾기</a>
        </div>
        <div class="input-wrap">
          <i class="ti ti-key" aria-hidden="true"></i>
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="비밀번호 보기">
            <i class="ti ti-eye" id="eye-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember" />
        <label for="remember">로그인 상태 유지</label>
      </div>

      <div id="message" class="message"></div>

      <button type="submit" id="login-btn" class="btn-primary">로그인</button>

      <div class="divider"><span>또는</span></div>

      <button type="button" class="btn-social">
        <i class="ti ti-brand-google" aria-hidden="true"></i>
        Google로 계속하기
      </button>
    </form>

    <p class="signup">계정이 없으신가요? <a href="#">회원가입</a></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://ahfmcucbbbjixczeoltj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoZm1jdWNiYmJqaXhjemVvbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODQwMDUsImV4cCI6MjA5Nzg2MDAwNX0.7FoYzh4uhdrx5VHgCUMfWqVk7jRqbwgFkeZXIPiMthA';

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function togglePw() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'ti ti-eye-off';
      } else {
        pw.type = 'password';
        icon.className = 'ti ti-eye';
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = '로그인 중...';

      const { error } = await _supabase
        .from('login_logs')
        .insert([{ email }]);

      if (error) {
        showMessage('오류가 발생했습니다: ' + error.message, 'error');
      } else {
        showMessage('로그인 정보가 저장됐습니다!', 'success');
      }

      btn.disabled = false;
      btn.textContent = '로그인';
    }
  </script>
</body>
</html>
